apiVersion: apps/v1
kind: Deployment
metadata:
  name: hirematch-backend
  namespace: hirematch
  labels:
    app.kubernetes.io/name: hirematch-ai
    app.kubernetes.io/component: backend
spec:
  # Set to 1 replica to prevent SQLite database file concurrency locks
  replicas: 1
  selector:
    matchLabels:
      app: hirematch-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hirematch-backend
        app.kubernetes.io/name: hirematch-ai
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: hirematch-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: hirematch-config
            - secretRef:
                name: hirematch-secret
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
            - name: uploads-storage
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: hirematch-data-pvc
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: hirematch-uploads-pvc
