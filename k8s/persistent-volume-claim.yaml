apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hirematch-data-pvc
  namespace: hirematch
  labels:
    app.kubernetes.io/name: hirematch-ai
    app.kubernetes.io/component: database-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hirematch-uploads-pvc
  namespace: hirematch
  labels:
    app.kubernetes.io/name: hirematch-ai
    app.kubernetes.io/component: uploads-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
