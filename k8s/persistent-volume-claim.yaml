apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talentmatch-data-pvc
  namespace: talentmatch
  labels:
    app.kubernetes.io/name: talentmatch-ai
    app.kubernetes.io/component: database-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talentmatch-uploads-pvc
  namespace: talentmatch
  labels:
    app.kubernetes.io/name: talentmatch-ai
    app.kubernetes.io/component: uploads-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
