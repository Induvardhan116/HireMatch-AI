apiVersion: v1
kind: Service
metadata:
  name: hirematch-backend
  namespace: hirematch
  labels:
    app.kubernetes.io/name: hirematch-ai
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: hirematch-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# Internal DNS alias service to support frontend Nginx proxy_pass (http://backend:8000)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hirematch
  labels:
    app.kubernetes.io/name: hirematch-ai
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: hirematch-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
