apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hirematch

resources:
  - namespace.yaml
  - configmap.yaml
  - persistent-volume-claim.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  # Ingress is optional. Uncomment if an Ingress controller (e.g. ingress-nginx) is installed:
  # - ingress.yaml

# Note: The Secret 'hirematch-secret' is created imperatively via kubectl to prevent
# committing secrets to git. See README.md or deployment instructions for the command.
