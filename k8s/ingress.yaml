apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hirematch-ingress
  namespace: hirematch
  labels:
    app.kubernetes.io/name: hirematch-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hirematch-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hirematch-frontend
                port:
                  number: 80
