apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talentmatch-ingress
  namespace: talentmatch
  labels:
    app.kubernetes.io/name: talentmatch-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: talentmatch-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: talentmatch-frontend
                port:
                  number: 80
