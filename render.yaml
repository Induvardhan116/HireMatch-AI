# Render Blueprint for HireMatch AI (Native Python + Static Site + Managed PostgreSQL, no Docker)
# Note on File Storage: Render free-tier web services use an ephemeral filesystem.
# Raw resume files written to UPLOAD_DIR are not persisted across restarts or redeploys,
# whereas extracted text, skills, metadata, and applications are persisted in PostgreSQL.

databases:
  - name: hirematch-db
    plan: free
    databaseName: hirematch
    user: hirematch

services:
  # 1. FastAPI Backend (Python Web Service)
  - type: web
    name: hirematch-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PROJECT_NAME
        value: "HireMatch AI"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: hirematch-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: WEIGHT_SKILLS
        value: "0.50"
      - key: WEIGHT_KEYWORDS
        value: "0.30"
      - key: WEIGHT_EXPERIENCE
        value: "0.20"

  # 2. React + Vite Frontend (Static Site - free on Render)
  - type: web
    name: hirematch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hirematch-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

