version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentmatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=HireMatch AI
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=talentmatch-ai-insecure-default-change-in-production-super-secret-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:////app/data/talentmatch.db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=10
      - WEIGHT_SKILLS=0.50
      - WEIGHT_KEYWORDS=0.30
      - WEIGHT_EXPERIENCE=0.20
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - talentmatch-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentmatch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - talentmatch-net

volumes:
  backend-data:
    name: talentmatch_backend_data
  backend-uploads:
    name: talentmatch_backend_uploads

networks:
  talentmatch-net:
    name: talentmatch_network
    driver: bridge

